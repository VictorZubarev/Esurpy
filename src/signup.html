<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Provia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Provia</h1>
        <p>Build your work. Measure your impact. Keep the evidence.</p>
    </header>

    <main>
        <section>
            <h2>Create your Provia profile.</h2>

            <p>
                Start building your professional record and keep track
                of your work, achievements, results, and evidence.
            </p>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name">

                

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">

                

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password">

                

                <button type="submit">Create Profile</button>
            </form>
        </section>
    </main>

</body>
</html>
